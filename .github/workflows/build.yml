name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0"

      - name: Unit tests (decision engine is pure JVM)
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Privacy gate — no network/storage/location permissions
        run: ./scripts/verify_privacy_guarantees.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
